# Extensión local: docker compose -f compose.yaml -f compose.app.yaml up --build -d
# Los puertos 5104/5180 evitan interferir con la API y Next de desarrollo.
x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_HTTP_PORTS: "8080"
  AllowedHosts: "localhost;127.0.0.1"
  Database__ApplyMigrationsOnStartup: "true"
  ConnectionStrings__BufeteDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB es obligatorio};Username=${POSTGRES_USER:?POSTGRES_USER es obligatorio};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio};Maximum Pool Size=30;Minimum Pool Size=2"
  Cors__AllowedOrigins__0: "http://127.0.0.1:${WEB_HOST_PORT:-5180}"
  Cors__AllowedOrigins__1: "http://localhost:${WEB_HOST_PORT:-5180}"
  Jwt__Issuer: "${Jwt__Issuer:?Jwt__Issuer es obligatorio}"
  Jwt__Audience: "${Jwt__Audience:?Jwt__Audience es obligatorio}"
  Jwt__SigningKey: "${Jwt__SigningKey:?Jwt__SigningKey es obligatorio}"
  Jwt__AccessTokenMinutes: "${Jwt__AccessTokenMinutes:-15}"
  Jwt__RefreshTokenDays: "${Jwt__RefreshTokenDays:-7}"
  BootstrapAdmin__Username: "${BootstrapAdmin__Username:?BootstrapAdmin__Username es obligatorio}"
  BootstrapAdmin__Email: "${BootstrapAdmin__Email:?BootstrapAdmin__Email es obligatorio}"
  BootstrapAdmin__FullName: "${BootstrapAdmin__FullName:?BootstrapAdmin__FullName es obligatorio}"
  BootstrapAdmin__Password: "${BootstrapAdmin__Password:?BootstrapAdmin__Password es obligatorio}"
  PlatformAdmin__Email: "${PlatformAdmin__Email:-}"
  PlatformAdmin__Password: "${PlatformAdmin__Password:-}"
  Storage__Provider: S3
  Storage__S3__BucketName: "${MINIO_BUCKET:-bufete-documentos}"
  Storage__S3__Region: us-east-1
  Storage__S3__ServiceUrl: "http://minio:9000"
  Storage__S3__ForcePathStyle: "true"
  Storage__S3__UsePresignedUrls: "false"
  Storage__S3__AccessKey: "${MINIO_ROOT_USER:?MINIO_ROOT_USER es obligatorio}"
  Storage__S3__SecretKey: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD es obligatorio}"
  Storage__S3__KeyPrefix: bufete

services:
  minio:
    environment:
      MINIO_API_CORS_ALLOW_ORIGIN: "http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:${WEB_HOST_PORT:-5180},http://localhost:${WEB_HOST_PORT:-5180}"

  api:
    image: bufete-juridico-umg/api:local
    build:
      context: .
      dockerfile: Dockerfile.api
    init: true
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_HOST_PORT:-5104}:8080"
    volumes:
      - api_dataprotection:/home/app/.aspnet/DataProtection-Keys
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    image: bufete-juridico-umg/web:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://127.0.0.1:${API_HOST_PORT:-5104}/api/v1"
        NEXT_PUBLIC_SCANNER_AGENT_URL: "http://127.0.0.1:17654"
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-5180}:3000"
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  api_dataprotection:
    name: bufete_juridico_api_dataprotection
